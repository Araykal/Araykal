<svg width="720" height="34" viewBox="0 0 720 34" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">c</title>
  <desc id="desc">c</desc>
  <defs>
    <linearGradient id="g" x1="110" y1="0" x2="610" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".5" stop-color="#E2E8F0"/><stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <clipPath id="reveal"><rect x="0" y="0" width="0" height="34"><animate attributeName="width" from="0" to="720" dur="4.8s" begin="0s" fill="freeze"/></rect></clipPath>
    <style>
      .t { font: 500 15px "JetBrains Mono", "Cascadia Code", monospace; letter-spacing: .3px; fill: url(#g); animation: breathe 3.6s ease-in-out 4.8s infinite; transform-origin: 360px 17px; }
      .caret { fill: #CBD5E1; animation: caret 1s steps(1,end) infinite; }
      @keyframes breathe { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
      @keyframes caret { 50% { opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#reveal)">
    <text class="t" x="110" y="22">learning deeply · building deliberately · sharing clearly</text>
    <text class="caret" x="616" y="22" font-family="monospace" font-size="15">▌</text>
  </g>
</svg>
